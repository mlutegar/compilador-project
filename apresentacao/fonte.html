<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tupã · Apresentação final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1116; --bg2:#161B22; --bg3:#0A0D12; --linha:#2A313B;
  --laranja:#FF7A1A; --verde:#2EE6A6; --verm:#FF5A6A; --amarelo:#FFD166; --roxo:#C792FF;
  --cinza:#98A2B3; --corpo:#C7CFDA; --branco:#F5F7FA;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace;
  --sans:"Inter","Segoe UI",system-ui,sans-serif;
  --logo:url({{LOGO}});
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--sans);color:var(--corpo);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden}
.slide{position:absolute;inset:0;padding:48px 72px 0;display:none;flex-direction:column;background:var(--bg)}
.slide.on{display:flex}
.cx{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:64px}
.slide::before{content:"";position:absolute;left:0;top:0;width:8px;height:100%;background:var(--laranja)}
.mini{position:absolute;right:56px;top:34px;width:46px;height:46px;background:var(--logo) center/contain no-repeat;opacity:.9}
.kicker{font-size:15px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--laranja)}
h2{font-size:38px;font-weight:800;color:var(--branco);line-height:1.15;margin-top:6px;letter-spacing:-.01em;max-width:1050px}
h2 em{font-style:normal;color:var(--verde)}
.rodape{position:absolute;left:72px;right:72px;bottom:20px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;color:#6B7686;text-transform:uppercase}
.cinza{color:var(--cinza)} .verde{color:var(--verde)} .laranja{color:var(--laranja)} .verm{color:var(--verm)} .branco{color:var(--branco)}
.grid{display:grid;gap:20px}
.painel{background:var(--bg2);border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.painel .tit{font-family:var(--mono);font-size:13px;color:var(--cinza);padding:8px 16px;border-bottom:1px solid var(--linha);background:#12171D;display:flex;justify-content:space-between}
.painel .tit b{color:var(--laranja);font-weight:700}
pre{font-family:var(--mono);font-size:16px;line-height:1.5;color:#E6EAF0;padding:12px 16px;white-space:pre;tab-size:2}
.k{color:var(--laranja);font-weight:700}.t{color:var(--verde)}.h{color:var(--roxo)}
.n{color:var(--amarelo)}.c{color:#6B7686;font-style:italic}.s{color:#9BE7C4}.e{color:var(--verm)}
.chip{display:inline-block;font-family:var(--mono);font-size:16px;padding:6px 14px;border-radius:999px;background:var(--bg2);border:1px solid var(--linha);color:var(--branco);margin:0 6px 8px 0}
.chip.o{border-color:var(--laranja);color:var(--laranja)} .chip.v{border-color:var(--verde);color:var(--verde)} .chip.r{border-color:var(--verm);color:var(--verm)}
.card{background:var(--bg2);border:1px solid var(--linha);border-radius:12px;padding:22px 20px}
.card h3{font-size:24px;color:var(--branco);margin-bottom:8px}
.card p{font-size:19px;line-height:1.35}
.card.t{border-color:var(--laranja);box-shadow:0 0 0 1px var(--laranja) inset}
.card.t h3{color:var(--laranja)}
.card h3.verde{color:var(--verde)} .card h3.laranja{color:var(--laranja)} .card h3.roxo{color:var(--roxo)}
table{border-collapse:collapse;width:100%}
th{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza);text-align:left;padding:8px 14px;border-bottom:2px solid var(--laranja);font-weight:600}
td{padding:10px 14px;border-bottom:1px solid var(--linha);color:var(--branco);font-family:var(--mono);font-size:17px}
td:first-child{font-family:var(--sans);font-weight:600}
.term{background:var(--bg3);border:1px solid var(--linha);border-radius:12px}
.term pre{color:#D8DEE8}
.num{font-size:76px;font-weight:800;line-height:1;color:var(--verde);letter-spacing:-.02em}
.num small{font-size:22px;font-weight:600;color:var(--cinza);letter-spacing:0;margin-left:6px}
.rot{font-size:15px;color:var(--cinza);margin-top:4px;letter-spacing:.04em}
.passo{display:flex;gap:16px;align-items:center;font-size:27px;color:var(--branco);margin-bottom:20px}
.gd td{font-size:20px;padding:16px 14px}.gd th{font-size:13px;white-space:nowrap}
.passo i{font-style:normal;font-family:var(--mono);font-weight:700;width:42px;height:42px;flex:none;border-radius:50%;background:var(--laranja);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px}
#notas{position:absolute;left:0;right:0;bottom:0;max-height:48%;overflow:auto;background:rgba(9,11,15,.97);border-top:2px solid var(--verde);padding:16px 72px 18px;font-size:17px;line-height:1.45;color:var(--branco);display:none;z-index:9}
#notas.on{display:block}
#notas b{color:var(--verde)}
#dica{position:absolute;right:16px;bottom:8px;font-size:11px;color:#3F4752;font-family:var(--mono);z-index:5}
template{display:none}
@media print{
  @page{size:1280px 720px;margin:0}
  html,body{overflow:visible;background:var(--bg);width:1280px;height:auto}
  #stage{position:static;transform:none!important;height:auto;overflow:visible}
  .slide{display:flex;position:relative;width:1280px;height:720px;page-break-after:always;break-after:page;overflow:hidden}
  #notas,#dica{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="stage">
<div id="dica">setas navegam · N notas · F tela cheia</div>
{{SLIDES}}
<div id="notas"></div>
</div>
<script>
const KW = new Set({{KW}});
const TIPOS = new Set("inteiro decimal texto booleano".split(" "));
const HW = new Set("nfc ir led botao".split(" "));
const EVT = new Set("iniciar obstaculo cartao".split(" "));
const CPPK = new Set("void int bool byte if else for while return const struct unsigned long String char define include true false".split(" "));
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function hlTupa(src){
  const re = /(#[^\n]*)|("[^"\n]*")|(\b[0-9]+(?:\.[0-9]+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  let out = "", m, prev = "";
  while((m = re.exec(src))){
    if(m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if(m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if(m[3]) out += `<span class="n">${m[3]}</span>`;
    else if(m[4]){
      const w = m[4];
      if(TIPOS.has(w)) out += `<span class="t">${w}</span>`;
      else if(HW.has(w)) out += `<span class="h">${w}</span>`;
      else if(KW.has(w)) out += `<span class="k">${w}</span>`;
      else if(EVT.has(w) && prev === "ao") out += `<span class="k">${w}</span>`;
      else out += w;
      prev = w;
    } else { out += esc(m[5]); if(!/\s/.test(m[5])) prev = ""; }
  }
  return out;
}
function hlCpp(src){
  const re = /(\/\/[^\n]*)|("[^"\n]*")|(\b0x[0-9A-Fa-f]+\b|\b[0-9]+\b)|(#?[A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  let out = "", m;
  while((m = re.exec(src))){
    if(m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if(m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if(m[3]) out += `<span class="n">${m[3]}</span>`;
    else if(m[4]) out += CPPK.has(m[4].replace("#","")) ? `<span class="k">${m[4]}</span>` : m[4];
    else out += esc(m[5]);
  }
  return out;
}
function hlEbnf(src){
  return esc(src).replace(/(&quot;|")([^"\n]*?)"/g, '<span class="s">"$2"</span>')
    .replace(/(::=|\||\*|\?)/g, '<span class="k">$1</span>');
}
function hlJson(src){
  return esc(src).replace(/"([^"]*)"(\s*:)/g,'<span class="h">"$1"</span>$2')
    .replace(/: ("[^"]*")/g,': <span class="s">$1</span>').replace(/\b([0-9]+)\b/g,'<span class="n">$1</span>');
}
document.querySelectorAll("pre.tupa").forEach(p => p.innerHTML = hlTupa(p.textContent));
document.querySelectorAll("pre.cpp,pre.py").forEach(p => p.innerHTML = hlCpp(p.textContent));
document.querySelectorAll("pre.ebnf").forEach(p => p.innerHTML = hlEbnf(p.textContent));
document.querySelectorAll("pre.json").forEach(p => p.innerHTML = hlJson(p.textContent));

const slides = [...document.querySelectorAll(".slide")];
const notasEl = document.getElementById("notas");
const stage = document.getElementById("stage");
let atual = 0;
function mostrar(i){
  atual = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,k) => s.classList.toggle("on", k === atual));
  const t = slides[atual].querySelector("template.notas");
  notasEl.innerHTML = t ? t.innerHTML : "";
  history.replaceState(null, "", "#" + (atual+1));
}
function ajustar(){
  const k = Math.min(innerWidth/1280, innerHeight/720);
  stage.style.transform = `scale(${k})`;
  stage.style.left = (innerWidth - 1280*k)/2 + "px";
  stage.style.top = (innerHeight - 720*k)/2 + "px";
}
addEventListener("resize", ajustar);
addEventListener("keydown", e => {
  if(["ArrowRight","PageDown"," "].includes(e.key)) { mostrar(atual+1); e.preventDefault(); }
  else if(["ArrowLeft","PageUp"].includes(e.key)) { mostrar(atual-1); e.preventDefault(); }
  else if(e.key === "Home") mostrar(0);
  else if(e.key === "End") mostrar(slides.length-1);
  else if(e.key === "n" || e.key === "N") notasEl.classList.toggle("on");
  else if(e.key === "f" || e.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
addEventListener("click", e => { if(e.clientX > innerWidth/2) mostrar(atual+1); else mostrar(atual-1); });
ajustar();
mostrar((parseInt(location.hash.slice(1)) || 1) - 1);
</script>
</body>
</html>
